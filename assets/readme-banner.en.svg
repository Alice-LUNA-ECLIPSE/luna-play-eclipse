<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Luna Play Eclipse</title>
  <desc id="desc">A night-sky banner for the Luna Play Eclipse Windows media player.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/><stop offset="0.58" stop-color="#111a32"/><stop offset="1" stop-color="#102a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(930 90) rotate(90) scale(260 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10d9ea" stop-opacity=".24"/><stop offset="1" stop-color="#10d9ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="75" y1="75" x2="205" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8bf4ff"/><stop offset="1" stop-color="#3487ff"/>
    </linearGradient>
    <filter id="softGlow" x="45" y="35" width="210" height="220" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#glow)"/>
  <g fill="#d8f7ff">
    <circle cx="298" cy="62" r="2" opacity=".75"/><circle cx="382" cy="270" r="1.7" opacity=".55"/>
    <circle cx="520" cy="73" r="1.5" opacity=".62"/><circle cx="704" cy="280" r="2" opacity=".48"/>
    <circle cx="844" cy="58" r="1.5" opacity=".7"/><circle cx="1053" cy="235" r="2" opacity=".58"/>
    <circle cx="1112" cy="112" r="1.4" opacity=".75"/><circle cx="940" cy="284" r="1.4" opacity=".52"/>
  </g>
  <circle cx="150" cy="164" r="72" fill="#54dcff" opacity=".24" filter="url(#softGlow)"/>
  <mask id="crescentMask"><rect width="1200" height="340" fill="#000"/><circle cx="150" cy="158" r="59" fill="#fff"/><circle cx="176" cy="136" r="54" fill="#000"/></mask>
  <circle cx="150" cy="158" r="62" fill="url(#moon)" mask="url(#crescentMask)"/>
  <g fill="#74efff"><path d="m219 97 4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="m91 243 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".75"/></g>
  <text x="292" y="148" fill="#f4f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4">LUNA PLAY</text>
  <text x="296" y="199" fill="#65e7f2" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="8">E C L I P S E</text>
  <path d="M296 226h515" stroke="#69e6f1" stroke-opacity=".42"/>
  <text x="296" y="264" fill="#c6d2e7" font-family="Segoe UI, Arial, sans-serif" font-size="20">A desktop media player for Windows</text>
  <text x="296" y="293" fill="#8392ad" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1">ELECTRON · PLAYLIST · SUBTITLES · AMBILIGHT</text>
</svg>

